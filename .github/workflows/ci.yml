name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  UV_VERSION: "latest"

jobs:
  # Backend linting and type checking
  backend-lint:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent-engine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run mypy typecheck
        run: uv run mypy app --strict

  # Backend tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent-engine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_sentinel
          POSTGRES_USER: db_sentinel
          POSTGRES_PASSWORD: db_sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U db_sentinel -d db_sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://db_sentinel:db_sentinel@localhost:5432/db_sentinel

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://db_sentinel:db_sentinel@localhost:5432/db_sentinel
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: test-encryption-key
          OLLAMA_BASE_URL: http://localhost:11434
          AI_DEFAULT_PROVIDER: ollama
          AI_PREFER_LOCAL: "true"
          ALLOW_REGISTRATION: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./agent-engine/coverage.xml
          flags: backend

  # Frontend linting and type checking
  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript typecheck
        run: npm run typecheck

  # Frontend tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-dashboard
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test -- --run --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./web-dashboard/coverage/lcov.info
          flags: frontend

  # Frontend build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-dashboard
    needs: [frontend-lint, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ./web-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # Docker build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-engine
        uses: docker/build-push-action@v5
        with:
          context: ./agent-engine
          push: true
          tags: ghcr.io/${{ github.repository }}/agent-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./web-dashboard
          push: true
          tags: ghcr.io/${{ github.repository }}/web-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit (Python)
        run: |
          pip install bandit
          bandit -r agent-engine/app -f json -o bandit-results.json || true

      - name: Run npm audit
        run: |
          cd web-dashboard
          npm audit --audit-level=high || true

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-engine
        uses: docker/build-push-action@v5
        with:
          context: ./agent-engine
          file: ./agent-engine/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/agent-engine:staging

      - name: Build and push web-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./web-dashboard
          file: ./web-dashboard/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/web-dashboard:staging

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add staging deployment commands here
          # Example: kubectl apply -f k8s/staging/

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent-engine
        uses: docker/build-push-action@v5
        with:
          context: ./agent-engine
          file: ./agent-engine/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/agent-engine:${{ github.sha }}
            ghcr.io/${{ github.repository }}/agent-engine:latest

      - name: Build and push web-dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./web-dashboard
          file: ./web-dashboard/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web-dashboard:latest

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add production deployment commands here
          # Example: kubectl apply -f k8s/production/

  # Notify on failure
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, frontend-build, security-scan, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Send failure notification
        run: echo "CI pipeline failed. Check GitHub Actions for details."
        # Add Slack/Discord/Email notification here