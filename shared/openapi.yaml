openapi: 3.1.0
info:
  title: DB Sentinel API
  version: 1.0.0
  description: AI-Powered Database Management Agent API
servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: https://api.db-sentinel.io/api/v1
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, AI_PROVIDER_ERROR, INTERNAL_ERROR]
            message:
              type: string
            details:
              type: array
              items:
                type: object
      required: [error]

    # Auth schemas
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        full_name:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        roles:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    # Database schemas
    DatabaseCreate:
      type: object
      required: [name, type, host, database_name]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [postgresql, mysql, sqlite, sqlserver, oracle]
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        schema_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 255
        password:
          type: string
          format: password
        connection_options:
          type: object
        pool_config:
          type: object
        tags:
          type: array
          items:
            type: string
        description:
          type: string

    DatabaseUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [postgresql, mysql, sqlite, sqlserver, oracle]
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        schema_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 255
        password:
          type: string
          format: password
        connection_options:
          type: object
        pool_config:
          type: object
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        is_active:
          type: boolean

    DatabaseOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        host:
          type: string
        port:
          type: integer
        database_name:
          type: string
        schema_name:
          type: string
        username:
          type: string
        connection_options:
          type: object
        pool_config:
          type: object
        tags:
          type: array
          items:
            type: string
        description:
          type: string
        is_active:
          type: boolean
        last_tested_at:
          type: string
          format: date-time
        last_test_status:
          type: string
          enum: [success, failed]
        last_test_error:
          type: string
        version:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TestResult:
      type: object
      properties:
        success:
          type: boolean
        latency_ms:
          type: integer
        version:
          type: string
        error:
          type: string

    # Health schemas
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        checks:
          type: object

    # WebSocket schemas
    WSConnected:
      type: object
      properties:
        type:
          type: string
          enum: [connected]
        connection_id:
          type: string
          format: uuid

    WSEvent:
      type: object
      properties:
        type:
          type: string
        payload:
          type: object

    WSPing:
      type: object
      properties:
        type:
          type: string
          enum: [ping]

    WSPong:
      type: object
      properties:
        type:
          type: string
          enum: [pong]

    WSSubscribe:
      type: object
      required: [type, channels]
      properties:
        type:
          type: string
          enum: [subscribe]
        channels:
          type: array
          items:
            type: string

    WSUnsubscribe:
      type: object
      required: [type, channels]
      properties:
        type:
          type: string
          enum: [unsubscribe]
        channels:
          type: array
          items:
            type: string

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      summary: Readiness check
      tags: [Health]
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      summary: Register new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Registration disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /databases:
    get:
      summary: List database connections
      tags: [Databases]
      security:
        - BearerAuth: []
      parameters:
        - name: active_only
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of databases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabaseOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create database connection
      tags: [Databases]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseCreate'
      responses:
        '201':
          description: Database created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseOut'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Database name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /databases/{database_id}:
    get:
      summary: Get database connection
      tags: [Databases]
      security:
        - BearerAuth: []
      parameters:
        - name: database_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Database details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseOut'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update database connection
      tags: [Databases]
      security:
        - BearerAuth: []
      parameters:
        - name: database_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdate'
      responses:
        '200':
          description: Database updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseOut'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Database name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete database connection
      tags: [Databases]
      security:
        - BearerAuth: []
      parameters:
        - name: database_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Database deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /databases/{database_id}/test:
    post:
      summary: Test database connection
      tags: [Databases]
      security:
        - BearerAuth: []
      parameters:
        - name: database_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Database not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws:
    get:
      summary: WebSocket endpoint for real-time updates
      tags: [WebSocket]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching protocols
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'