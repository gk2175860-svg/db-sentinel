# Production docker-compose for DB Sentinel
version: '3.8'

services:
  # PostgreSQL for metadata storage (production)
  postgres:
    image: postgres:16-alpine
    container_name: db-sentinel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-db_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-db_sentinel} -d ${POSTGRES_DB:-db_sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - db-sentinel-network

  # Redis for queue, cache, pub/sub
  redis:
    image: redis:7-alpine
    container_name: db-sentinel-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - db-sentinel-network

  # Ollama for local LLM (optional - can use cloud providers instead)
  ollama:
    image: ollama/ollama:latest
    container_name: db-sentinel-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - db-sentinel-network

  # Backend API
  agent-engine:
    build:
      context: ./agent-engine
      dockerfile: Dockerfile.prod
    container_name: db-sentinel-agent-engine
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-db_sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-db_sentinel}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db-sentinel-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend Dashboard (nginx)
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile.prod
    container_name: db-sentinel-web-dashboard
    ports:
      - "80:80"
    depends_on:
      - agent-engine
    restart: unless-stopped
    networks:
      - db-sentinel-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  db-sentinel-network:
    driver: bridge