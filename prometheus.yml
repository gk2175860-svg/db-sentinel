# Prometheus configuration for DB Sentinel
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'db-sentinel'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # DB Sentinel Backend API
  - job_name: 'db-sentinel-backend'
    metrics_path: '/metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['agent-engine:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'db-sentinel-backend'

  # DB Sentinel Frontend (nginx)
  - job_name: 'db-sentinel-frontend'
    metrics_path: '/nginx_status'
    scrape_interval: 30s
    static_configs:
      - targets: ['web-dashboard:80']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'db-sentinel-frontend'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
      target_label: instance
      replacement: 'redis'

  # Node Exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
      target_label: instance
      replacement: 'node'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
      target_label: instance
      replacement: 'cadvisor'

  # Ollama (if running)
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
      target_label: instance
      replacement: 'ollama'